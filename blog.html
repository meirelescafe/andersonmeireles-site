<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Meireles Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --red: #CE0E2D;
      --green: #00AC69;
      --yellow: #FFC629;
      --offwhite: #EAE1EB;
      --dark: #2D2A26;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--offwhite); color: var(--dark); }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: rgba(234,225,235,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--dark);
    }
    .nav-logo { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; font-weight: 600; color: var(--red); text-decoration: none; }
    .nav-back {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--dark); text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--red); }

    /* HEADER */
    .blog-header {
      background: var(--dark);
      padding: 80px 80px 60px;
      border-bottom: 3px solid var(--red);
    }
    .blog-header .tag {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 3px; color: var(--yellow); margin-bottom: 16px; display: block;
    }
    .blog-header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(40px, 6vw, 80px);
      color: var(--offwhite); line-height: 1; margin-bottom: 16px;
    }
    .blog-header p { font-size: 1rem; color: rgba(234,225,235,0.55); max-width: 500px; line-height: 1.7; }

    /* POSTS GRID */
    .posts-section { padding: 72px 80px; }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 32px;
    }
    .post-card {
      background: var(--dark);
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s, box-shadow 0.25s;
      border: 2px solid transparent;
    }
    .post-card:hover { transform: translateY(-6px); border-color: var(--red); box-shadow: 0 12px 40px rgba(206,14,45,0.15); }
    .post-thumb {
      width: 100%; height: 200px;
      object-fit: cover; display: block;
      background: #3a3631;
    }
    .post-thumb-placeholder {
      width: 100%; height: 200px;
      background: linear-gradient(135deg, #3a3631, #2d2a26);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }
    .post-body { padding: 28px; }
    .post-date {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--yellow); margin-bottom: 10px; display: block;
    }
    .post-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem; color: var(--offwhite);
      line-height: 1.2; margin-bottom: 12px;
    }
    .post-summary { font-size: 0.88rem; color: rgba(234,225,235,0.55); line-height: 1.7; }
    .post-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .post-tag {
      background: rgba(255,255,255,0.06);
      color: rgba(234,225,235,0.5);
      padding: 4px 12px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    }
    .post-read {
      margin-top: 20px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.82rem; font-weight: 700; color: var(--red);
      text-transform: uppercase; letter-spacing: 1px;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 80px 40px;
      grid-column: 1/-1;
    }
    .empty-state p { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: rgba(45,42,38,0.3); }

    /* LOADING */
    .loading { text-align: center; padding: 80px; font-family: 'Fredoka', sans-serif; font-size: 1.2rem; color: rgba(45,42,38,0.4); }

    /* FOOTER */
    footer {
      background: #1a1714; border-top: 2px solid rgba(255,255,255,0.06);
      padding: 32px 80px; text-align: center;
    }
    footer p { font-size: 0.8rem; color: rgba(255,255,255,0.2); }

    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .blog-header { padding: 60px 32px 48px; }
      .posts-section { padding: 48px 24px; }
      footer { padding: 32px 24px; }
    }

    .nav-logo-link { display: flex; align-items: center; text-decoration: none; }
    .blog-nav-logo { height: 34px; width: auto; display: block; }

  </style>
</head>

    <h1>Blog</h1>
    <p>Café, processo, cultura e coerência. Tudo o que penso sobre o universo do café, sem filtro.</p>
  </div>

  <section class="posts-section">
    <div class="posts-grid" id="postsGrid">
      <div class="loading">Carregando posts... ☕</div>
    </div>
  </section>

  <footer>
    <p>© 2026 Meireles Café · Consultoria, Educação e Cafés Especiais</p>
  </footer>

  <script>
    // Load posts from /posts/ directory via fetch
    // Posts are markdown files listed in posts-manifest.json
    async function loadPosts() {
      const grid = document.getElementById('postsGrid');
      try {
        const res = await fetch('/posts-manifest.json');
        if (!res.ok) throw new Error('No manifest');
        const posts = await res.json();

        if (!posts.length) {
          grid.innerHTML = '<div class="empty-state"><p>Em breve, novos posts. ☕</p></div>';
          return;
        }

        // Sort by date descending
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        grid.innerHTML = posts.map(post => {
          const date = new Date(post.date);
          const dateStr = date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
          const thumb = post.thumbnail
            ? `<img src="${post.thumbnail}" alt="${post.title}" class="post-thumb" />`
            : `<div class="post-thumb-placeholder">☕</div>`;
          const tags = (post.tags || []).map(t => `<span class="post-tag">${t}</span>`).join('');
          return `
            <a href="/post.html?slug=${post.slug}" class="post-card">
              ${thumb}
              <div class="post-body">
                <span class="post-date">${dateStr}</span>
                <h2 class="post-title">${post.title}</h2>
                <p class="post-summary">${post.summary || ''}</p>
                ${tags ? `<div class="post-tags">${tags}</div>` : ''}
                <div class="post-read">Ler post →</div>
              </div>
            </a>`;
        }).join('');
      } catch(e) {
        grid.innerHTML = '<div class="empty-state"><p>Em breve, novos posts. ☕</p></div>';
      }
    }
    loadPosts();
  </script>
</body>
</html>
