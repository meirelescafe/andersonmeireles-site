<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem enviada — Meireles Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2D2A26;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 40px 24px;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 24px; }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #FFC629;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    p {
      font-size: 1.1rem;
      color: rgba(234,225,235,0.7);
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    a {
      display: inline-block;
      background: #CE0E2D;
      color: #fff;
      padding: 16px 36px;
      border-radius: 100px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #00AC69; }
  </style>
</head>
<body>
  <div class="icon">☕</div>
  <h1>Mensagem enviada!</h1>
  <p>Anderson vai entrar em contato em breve. Obrigado pelo interesse!</p>
  <a href="/">Voltar ao site</a>
</body>
</html>
